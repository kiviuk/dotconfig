import = [
    # "~/.config/alacritty/themes/themes/coolnight.toml"
    "~/.config/alacritty/coolnight-theme/coolnight.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 0
option_as_alt = "Both"

# decorations = "Buttonless"

opacity = 0.8
blur = true

[font]
normal.family = "MesloLGS Nerd Font Mono"
# regular
size = 17

[selection]
# Default semantic_escape_chars minus the forward slash '/'
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

  #for video
# size = 35.0

# coolnight theme to the themes folder
# curl https://raw.githubusercontent.com/josean-dev/dev-environment-files/main/.config/alacritty/themes/themes/coolnight.toml --output ~/.config/alacritty/themes/themes/coolnight.toml

[keyboard]
bindings = [
  { key = "Return", mods = "Command", chars = "\u000a" },
  # Send Ctrl-Space to tmux as the prefix key.
  { key = "Space", mods = "Control", chars = "\u0000" },
  # Send Ctrl-Space then [ to tmux to enter vi copy mode with Command+[.
  { key = "LBracket", mods = "Command", chars = "\u0000[" },
  # Send Ctrl-Space then , to rename the tmux window with Command+R.
  { key = "R", mods = "Command", chars = "\u0000," },
  # Send Ctrl-Space then c to create a tmux window with Command+N.
  { key = "N", mods = "Command", chars = "\u0000c" },
  # Command+E reaches the tmux file picker; tmux routes Neovim panes to Snacks.
  { key = "E", mods = "Command", chars = "\u0000e" },
  # Command+G reaches the tmux dictionary picker; tmux routes Neovim panes to Snacks.
  { key = "G", mods = "Command", chars = "\u0000g" },
  # Command+B opens the tmux branch picker; tmux routes Neovim panes to Snacks.
  { key = "B", mods = "Command", chars = "\u0000b" },
  # Send Ctrl-Space then G to open the source-line picker with Command+Shift+G.
  { key = "G", mods = "Command|Shift", chars = "\u0000G" },
  # Send Ctrl-Space then B to toggle Bluetooth off / Q45 connection with Command+Shift+P.
  { key = "P", mods = "Command|Shift", chars = "\u0000B" },
  # Send Ctrl-Space then P to open the fuzzy Pi session picker with Command+Shift+S.
  { key = "S", mods = "Command|Shift", chars = "\u0000P" },
  # Send Ctrl-Space then l to toggle to the last tmux window with Command+L.
  { key = "L", mods = "Command", chars = "\u0000l" },
  # Send Ctrl-Space then O to open an ephemeral shell popup.
  { key = "O", mods = "Command", chars = "\u0000O" },
  # Send Ctrl-Space then Z to open LazyGit in the current pane's working directory.
  { key = "Z", mods = "Command", chars = "\u0000Z" },
  # Command+S reaches the tmux snippets picker; tmux routes Neovim panes to Snacks.
  { key = "S", mods = "Command", chars = "\u0000S" },
  # Send Ctrl-Space then A to open the tmux snippets editor with Command+A.
  { key = "A", mods = "Command", chars = "\u0000A" },
  # Send Ctrl-Space then h to split the tmux pane side by side with Command+Shift+H.
  { key = "H", mods = "Command|Shift", chars = "\u0000h" },
  # Send Ctrl-Space then < to move the tmux window left with Command+,.
  { key = "Comma", mods = "Command", chars = "\u0000<" },
  # Send Ctrl-Space then > to move the tmux window right with Command+..
  { key = "Period", mods = "Command", chars = "\u0000>" },
  # Command+X sends the tmux pane-zoom key (Shift+§ / ±).
  { key = "X", mods = "Command", chars = "±" },
  # Font size control (bypasses tmux)
  { key = "Equals", mods = "Control", mode = "~Vi|~Search", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", mode = "~Vi|~Search", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", mode = "~Vi|~Search", action = "ResetFontSize" },
]

